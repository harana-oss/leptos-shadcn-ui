[package]
name = "leptos-shadcn-tooltip"
description = "Leptos port of shadcn/ui Tooltip."
homepage = "https://shadcn-ui.rustforweb.org/components/tooltip.html"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.9.1"

[dependencies]
tailwind_fuse.workspace = true
leptos.workspace = true
leptos-node-ref.workspace = true
leptos-struct-component.workspace = true
leptos-style.workspace = true
web-sys.workspace = true
leptos-shadcn-signal-management.workspace = true

[features]
default = []
new_york = []

[dev-dependencies]
ctor = "0.6"
any_spawner = { version = "0.3", features = ["futures-executor"] }
shadcn-ui-test-utils = { path = "../../test-utils" }
wasm-bindgen-test = { workspace = true }

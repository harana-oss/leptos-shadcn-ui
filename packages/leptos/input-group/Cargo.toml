[package]
name = "leptos-shadcn-input-group"
description = "Leptos port of shadcn/ui input-group"
homepage = "https://ui.shadcn.com/docs/components/input-group"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.9.0"

[dependencies]
leptos.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Element", "HtmlElement", "EventTarget", "Event", "MouseEvent"] }
wasm-bindgen.workspace = true

[features]
default = []
new_york = []
